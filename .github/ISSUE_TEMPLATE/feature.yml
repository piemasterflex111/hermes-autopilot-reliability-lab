name: Engineering change
description: Define a bounded feature or improvement.
title: "[Change]: "
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What observable problem exists? }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Required outcome, description: What result must be observable? }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Allowed paths and boundaries }
    validations: { required: true }
  - type: textarea
    id: verification
    attributes: { label: Verification commands }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes: { label: Risks and rollback }
    validations: { required: true }
