name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify locked repository
        run: make verify
